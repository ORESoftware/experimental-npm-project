name: oreslang-pr9-audit

on:
  push:
    branches: ["ci/oreslang-pr9-audit"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Verify Oreslang
        working-directory: tmp/oreslang-pr9
        run: mvn -B -ntp verify